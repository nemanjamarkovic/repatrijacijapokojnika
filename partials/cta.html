<section class="cta" id="cta">
  <h2>{{ui.ctaTitle}}</h2>
  <p>{{ui.ctaBody}}</p>
  <div class="actions">
    <a class="button" href="tel:{{phone}}">{{ui.call}} {{phone}}</a>
    <a class="button button-secondary" href="{{whatsappHref}}">{{ui.whatsapp}}</a>
    <a class="button button-ghost" href="/kontakt/">{{ui.contact}}</a>
  </div>
</section>
