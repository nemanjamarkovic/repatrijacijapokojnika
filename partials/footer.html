<footer class="site-footer">
  <div class="wrap">
    <div class="footer-id">
      <p><strong>{{legalName}}</strong></p>
      <p>{{streetAddress}}, {{city}}</p>
      <p>{{ui.companyIdLabel}}: {{companyId}}</p>
      <p><a href="tel:{{phone}}">{{phone}}</a> · <a href="mailto:{{email}}">{{email}}</a></p>
    </div>
    <div class="footer-grid">
      {{{footerHtml}}}
    </div>
    <p class="disclaimer">{{disclaimer}}</p>
  </div>
</footer>
