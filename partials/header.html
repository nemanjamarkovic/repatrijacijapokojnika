<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="/">{{brandName}}</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">{{ui.menu}}</button>
    <nav id="site-nav" class="site-nav" aria-label="{{ui.navLabel}}">
      {{{navHtml}}}
    </nav>
    <a class="header-call" href="tel:{{phone}}">{{ui.call}} {{phone}}</a>
  </div>
</header>
